# NexAnalyzer CI. Runs on every ready (non-draft) pull request into main.
# The two jobs are the gates listed in docs/Development_Process.md; make both
# "required status checks" on main (Settings -> Branches) so nothing merges red.
name: CI

# Pull requests only (2026-10-25): the Actions allowance is 2,000
# min a month, Windows minutes count double, and a run on the push to main
# repeated the PR run on the same tree. Markdown-only changes skip CI.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
    # A draft PR runs nothing until it is marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
  # Monthly, on an unchanged tree: catches the runner image or a pinned wheel
  # going bad between PRs, before the next PR has to discover it.
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast and cheap: did an algorithm or a locked record change without saying so?
  algo-guard:
    name: Algorithm-change guard
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version bump + CHANGELOG for algorithm changes; stated reason for locked records
        run: python scripts/check_algo_change.py origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'

  # The numbers, then everything else, in one Windows job so Python and the
  # locked dependencies are installed once (Windows minutes count double).
  # Golden fit first: a moved fit fails in two minutes, not after the suite.
  tests:
    name: Golden fit + test suite
    if: github.event.pull_request.draft != true
    runs-on: windows-latest   # the app's own platform
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install (pinned)
        run: |
          # A fresh venv, so `pip check` sees only our tree: the runner's own
          # Python ships pipx, whose platformdirs floor our lock undercuts
          # (2026-10-24: "pipx 1.18.4 has requirement platformdirs>=4.12.2").
          # Outside the checkout, so ruff and pytest never walk its site-packages.
          python -m venv "$env:RUNNER_TEMP\ci-venv"
          "$env:RUNNER_TEMP\ci-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\ci-venv\Scripts\python.exe" -m pip install --upgrade pip
          & "$env:RUNNER_TEMP\ci-venv\Scripts\python.exe" -m pip install -r requirements.txt pytest pytest-cov pytest-xdist==3.8.0 ruff -c requirements-lock.txt
      - name: Dependencies are consistent
        run: python -m pip check
      - name: Lint (pyflakes + syntax only)
        run: python -m ruff check .
      - name: Golden fit (must not skip)
        env:
          NEXANALYZER_REQUIRE_GOLDEN: "1"
          # Not the machine that wrote the record: compare what rounding cannot
          # move (tests/unit/test_golden_fit.py, PORTABLE).
          NEXANALYZER_GOLDEN_PORTABLE: "1"
        run: python -m pytest tests/unit/test_golden_fit.py -q -p no:cacheprovider
      # The other tier: not "unchanged" but "right", against independent
      # references (tests/golden/README.md). Its report is the validation record.
      - name: Validated golden set
        run: python -m tests.golden.run --out dist/golden
      # Everything else, the locked OM contrast / zero-line / peak-metrics /
      # fitting numbers included, under coverage on the runner's 4 cores
      # (-n 4; 1,757 tests pass in parallel, 8.3 -> 6.2 min locally).
      # The floor is a ratchet, set just under the measured total: raise it as
      # coverage grows, never lower it to pass. A test over 10 min dumps every
      # thread's stack, so a hang on the runner names itself (NexAnalyzer_TSMC,
      # 2026-10-24: a QC flow test stalled CI for 43 min and took 12 s locally).
      - name: pytest (with coverage)
        run: >
          python -m pytest -q -p no:cacheprovider -n 4 -o faulthandler_timeout=600
          --ignore=tests/unit/test_golden_fit.py
          --cov=core --cov=modules --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml --cov-fail-under=87
          --junitxml=junit.xml --durations=15
      - name: Test, coverage and golden reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
            dist/golden/
          if-no-files-found: ignore
