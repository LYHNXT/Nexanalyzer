# NexAnalyzer CI. Runs on every pull request into main and every push to main.
# The three jobs are the gates listed in docs/Development_Process.md; make all three
# "required status checks" on main (Settings -> Branches) so nothing merges red.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly, on an unchanged tree: catches the runner image or a pinned wheel
  # going bad between PRs, before the next PR has to discover it.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast and cheap: did an algorithm or a locked record change without saying so?
  algo-guard:
    name: Algorithm-change guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version bump + CHANGELOG for algorithm changes; stated reason for locked records
        run: python scripts/check_algo_change.py origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - name: (push to main) compare with the previous main
        run: python scripts/check_algo_change.py ${{ github.event.before }}
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'

  # The numbers: the golden fit and the locked OM contrast record, on the pinned stack.
  algorithms:
    name: Golden fit + locked numbers
    runs-on: windows-latest   # the app's own platform
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff -c requirements-lock.txt
      - name: Dependencies are consistent
        run: python -m pip check
      - name: Lint (pyflakes + syntax only)
        run: python -m ruff check .
      - name: Golden fit (must not skip)
        env:
          NEXANALYZER_REQUIRE_GOLDEN: "1"
          # Not the machine that wrote the record: compare what rounding cannot
          # move (tests/unit/test_golden_fit.py, PORTABLE).
          NEXANALYZER_GOLDEN_PORTABLE: "1"
        run: python -m pytest tests/unit/test_golden_fit.py -q -p no:cacheprovider
      - name: Locked algorithm numbers
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/unit/test_om_contrast.py tests/unit/test_zero_line.py
          tests/unit/test_peak_metrics.py tests/unit/test_fitting.py

  # Everything else.
  tests:
    name: Full test suite
    needs: algorithms
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov ruff -c requirements-lock.txt
      # The golden fit already ran, required, in `algorithms`; everything else
      # runs here under coverage. The floor is a ratchet, set just under the
      # measured total: raise it as coverage grows, never lower it to pass.
      - name: pytest (with coverage)
        run: >
          python -m pytest -q -p no:cacheprovider
          --ignore=tests/unit/test_golden_fit.py
          --cov=core --cov=modules --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml --cov-fail-under=87
          --junitxml=junit.xml --durations=15
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore
