# Place this file at: .github/workflows/tests.yml
# Runs the test suite with coverage on every pull request to main
# and on every push to main.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only access to the repo is enough for running tests.
permissions:
  contents: read

# Cancel an older run when new commits are pushed to the same PR.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # match the version you use locally
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest pytest-cov

      - name: Run tests with coverage
        # Raise --cov-fail-under step by step as tests improve (e.g. 60 -> 70 -> 80).
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=0

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
