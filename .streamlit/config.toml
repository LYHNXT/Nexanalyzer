# NexAnalyzer's look (v5.44.0): grey page, white cards, a dark navigation
# sidebar, IBM Plex type and one blue accent. The design these values come
# from is the "NexAnalyzer UI" canvas; core/ui/theme.py carries the few rules
# the theme options can't express (white cards on the grey page).

[theme]
base = "light"
primaryColor = "#1D5FB8"
backgroundColor = "#F4F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15181C"
linkColor = "#1D5FB8"
borderColor = "#DDE1E6"
dataframeBorderColor = "#ECEEF1"
dataframeHeaderBackgroundColor = "#F6F7F9"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["1.85rem", "1.3rem", "1.1rem", "1.05rem", "1rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
greenColor = "#1E6B3A"
greenBackgroundColor = "#E5F2EA"
orangeColor = "#8A3F0A"
orangeBackgroundColor = "#FBEEDF"
redColor = "#A12B22"
redBackgroundColor = "#FBE7E4"
blueColor = "#1D5FB8"
blueBackgroundColor = "#E8F0FB"

[theme.sidebar]
backgroundColor = "#15181C"
secondaryBackgroundColor = "#26303D"
textColor = "#E6E8EB"
primaryColor = "#7FB0F0"
linkColor = "#7FB0F0"
borderColor = "#26303D"
